[General]
; "hires" mode is 640x480, otherwise 320x200
Hires = 1

; 3dfx mode (via OpenGL) -- enables hardware-accelerated rendering
Emulate3DFX = 1



FPSLimit = 144
PhysicsPerFrame = 1
Windowed = 1

[Slop]
; Fixes camera juddering when car is going up a hill, better results with PhysicsPerFrame=1
CameraJudderFix=1
; OS window size, independent of the internal BRender render resolution.
; The 3D scene renders at 640x480 and the OpenGL viewport scales to fill
; the window. Set to 0 or omit to use the game default.
Width = 3840
Height = 2160
; MSAA sample count for the OpenGL renderer (requires Emulate3DFX = 1).
; Common values: 0 (off), 2, 4, 8.
Msaa = 8
;
SampleRateShading=1
; When 1, ignore the can_be_stolen flag and allow stealing any wasted opponent car.
StealworthyAllCars = 0
; Percentage chance (0-100) of stealing a wasted opponent car. Default is 50.
StealworthyPercentage = 50
; When 1, disable the rank gate for car stealing (normally rank must be <= opponent's steal rank).
StealworthyRankLimitDisable = 0

[Games]
c1 = /opt/carma/c1

[Cheats]
EditMode = 0
FreezeTimer = 0
GameCompleted = 0

[Sound]
Enabled = 1
SoundOptionsScreen = 1
VolumeMultiplier = 1

[Network]
AdapterName = ""
